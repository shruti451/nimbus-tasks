version: "3.9"

services:

  flask:
    build: .
    container_name: nimbus-flask

    ports:
      - "5000:5000"

    depends_on:
      - mysql

  mysql:
    image: mysql:8.4

    container_name: nimbus-mysql

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: nimbusdb

    volumes:
    - mysql_data:/var/lib/mysql

    ports:
      - "3307:3306"

volumes:
  mysql_data: